<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Among Us IRL</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c16;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.logo{text-align:center;font-size:34px;font-weight:900;margin:20px 0 5px}.sub{text-align:center;color:#94a0b8;margin-bottom:20px}.card{background:#121a29;border:1px solid #29364e;border-radius:20px;padding:20px;margin:14px 0}input,button{width:100%;padding:14px;border-radius:12px;border:0;margin-top:10px;font-size:16px}input{background:#202b40;color:#fff;border:1px solid #34445f}button{background:#e63946;color:#fff;font-weight:800}.alt{background:#29364e}.green{background:#20966a}.code{text-align:center;font-size:42px;font-weight:900;letter-spacing:7px;color:#62d9ff}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{background:#1c2739;padding:12px;border-radius:12px}.hidden{display:none}.role{text-align:center;font-size:36px;font-weight:900;margin:20px 0}.crew{color:#62d9ff}.imp{color:#ff5361}.task{padding:12px;background:#1c2739;border-radius:10px;margin:7px 0}.timer{text-align:center;font-size:42px;font-weight:900}.small{font-size:13px;color:#9aa7bf;line-height:1.6}
</style></head><body><div class="wrap"><div class="logo">🔴 AMONG US IRL</div><div class="sub">النسخة الأونلاين — العبوا من موبايلاتكم</div>
<section id="home" class="card"><input id="name" placeholder="اسمك"><button onclick="create()">🏠 إنشاء غرفة</button><input id="code" placeholder="كود الغرفة"><button class="alt" onclick="join()">🚪 دخول الغرفة</button></section>
<section id="lobby" class="card hidden"><h2>الغرفة</h2><div id="codeShow" class="code"></div><p class="small">ابعت الكود لأصحابك. كل واحد يدخل من موبايله.</p><div id="players" class="players"></div><button id="start" onclick="start()">🚀 ابدأ اللعبة</button></section>
<section id="game" class="card hidden"><div id="role" class="role"></div><div id="tasks"></div><button class="green" onclick="meeting()">🚨 اجتماع طوارئ</button></section>
<section id="meet" class="card hidden"><h2>🚨 اجتماع</h2><div id="timer" class="timer">30</div><p>اختار اللاعب اللي تشك فيه:</p><div id="votes"></div></section>
<section id="result" class="card hidden" style="text-align:center"><h2>🏆 النتيجة</h2><div id="winner" class="role"></div><button onclick="location.reload()">🔄 لعبة جديدة</button></section>
</div><script>
const s=io();let me="",room="",alive=true,timer;
const $=x=>document.getElementById(x), show=x=>{["home","lobby","game","meet","result"].forEach(i=>$(i).classList.add("hidden"));$(x).classList.remove("hidden")};
function nm(){return $("name").value.trim()}
function create(){if(!nm())return alert("اكتب اسمك");s.emit("create",{name:nm()},r=>{if(!r.ok)return alert(r.msg);room=r.code;$("codeShow").textContent=room;show("lobby")})}
function join(){if(!nm()||!$("code").value.trim())return alert("اكتب الاسم والكود");s.emit("join",{name:nm(),code:$("code").value},r=>{if(!r.ok)return alert(r.msg);room=r.code;$("codeShow").textContent=room;show("lobby")})}
function start(){s.emit("start")}
function meeting(){s.emit("meeting")}
function render(r){if(!room)return;$("codeShow").textContent=r.code;$("players").innerHTML=r.players.map(p=>`<div class="p">👤 ${p.name}${p.alive?"":" ☠️"}</div>`).join("");}
s.on("room",render);
s.on("started",()=>show("game"));
s.on("role",x=>{alive=true;$("role").textContent=x.impostor?"🔪 IMPOSTOR":"🧑‍🚀 CREWMATE";$("role").className="role "+(x.impostor?"imp":"crew");$("tasks").innerHTML=x.impostor?"<p class='small'>مهمتك: خلّي الطاقم يخرج من اللعبة بدون ما يكشفوك 😈</p>":"<h3>📋 مهامك</h3>"+x.tasks.map(t=>`<div class='task'>⬜ ${t}</div>`).join("")});
s.on("meeting",x=>{show("meet");let n=x.seconds;clearInterval(timer);$("timer").textContent=n;timer=setInterval(()=>{n--;$("timer").textContent=n;if(n<=0){clearInterval(timer)}},1000)});
s.on("room",r=>{if(!$("meet").classList.contains("hidden")){$("votes").innerHTML=r.players.filter(p=>p.alive).map(p=>`<button class="alt" onclick="vote('${p.id}')">🗳️ ${p.name}</button>`).join("")}});
function vote(id){s.emit("vote",{target:id});$("votes").innerHTML="<p class='small'>تم تسجيل تصويتك. استنى باقي اللاعبين.</p>"}
s.on("voteDone",()=>{alert("التصويت انتهى");show("game")});
s.on("result",x=>{show("result");$("winner").textContent=x.winner==="crew"?"🧑‍🚀 الطاقم فاز!":"🔪 الـ Impostor فاز!"});
</script></body></html>
